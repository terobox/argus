# /etc/nginx/sites-available/argus  (Debian/Ubuntu layout)
#
# The web project is deployed by shipit as a `vite` project. `current` is a
# symlink switched atomically on each deploy, so nginx needs no reload.
#
# The project directory is mode 0750 owned by shipit, so nginx's system user
# must be in the shipit group:
#
#   sudo usermod -aG shipit www-data
#   sudo systemctl reload nginx
#
# The API is proxied to argus-server; SSE needs proxy_buffering off.

server {
    listen 80;
    server_name argus.example.com;

    root /srv/app/argus/web/current;
    index index.html;

    # Security headers. They used to be set by the Go static handler, which has
    # been removed now that the UI is served only by nginx.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # SSE real-time stream
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;   # SPA fallback
    }
}
