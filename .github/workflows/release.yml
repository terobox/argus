name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --dir web --frozen-lockfile

      - name: Build frontend
        run: pnpm --dir web build

      - name: Run Go tests
        run: go test -race ./...

      # Builds argus-server tarballs (amd64/arm64), argus-web tarball, the
      # agent's raw binaries, and one checksums.txt covering all of them.
      - name: Build release assets
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

  # Deploy the server first: a new frontend may call an API that only exists in
  # the new server. See docs/install.md ("升级与回滚").
  deploy-server:
    needs: release
    if: github.repository == 'terobox/argus'
    runs-on: ubuntu-latest
    steps:
      - uses: beyenpay/shipit@v1
        with:
          url: ${{ secrets.SHIPIT_URL }}
          secret: ${{ secrets.SHIPIT_SECRET }}
          project: argus-server
          tag: ${{ github.ref_name }}

  deploy-web:
    needs: deploy-server
    if: github.repository == 'terobox/argus'
    runs-on: ubuntu-latest
    steps:
      - uses: beyenpay/shipit@v1
        with:
          url: ${{ secrets.SHIPIT_URL }}
          secret: ${{ secrets.SHIPIT_SECRET }}
          project: argus-web
          tag: ${{ github.ref_name }}
