# goreleaser configuration for the two release artifacts: argus-server and
# argus-agent. Both are built as static, cgo-free Linux binaries and published as
# raw files (no archive wrapper) so install.sh and the agent's self-update can
# download them directly. See https://goreleaser.com.
version: 2

# Build the frontend before compiling the server, which embeds web/dist. Run
# `pnpm install --dir web` once (or via `make deps`) before the first release.
before:
  hooks:
    - pnpm --dir web build

builds:
  - id: server
    main: ./cmd/server
    binary: argus-server
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.serverVersion={{ .Version }}

  - id: agent
    main: ./cmd/agent
    binary: argus-agent
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.agentVersion={{ .Version }}

archives:
  - id: server
    ids: [server]
    formats: [binary]
    name_template: "argus-server_{{ .Os }}_{{ .Arch }}"

  - id: agent
    ids: [agent]
    formats: [binary]
    name_template: "argus-agent_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
