# goreleaser configuration for the two release artifacts: argus-server and
# argus-agent. Both are built as static, cgo-free Linux binaries and published as
# raw files (no archive wrapper) so install.sh and the agent's self-update can
# download them directly. See https://goreleaser.com.
#
# The frontend is no longer embedded in argus-server. Build it with
# `pnpm --dir web build` and deploy web/dist separately (static file server,
# reverse proxy, or the server's web_dir).
version: 2

builds:
  - id: server
    main: ./server/cmd/argus-server
    binary: argus-server
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.serverVersion={{ .Version }}

  - id: agent
    main: ./agent/cmd/argus-agent
    binary: argus-agent
    goos: [linux]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.agentVersion={{ .Version }}

archives:
  - id: server
    ids: [server]
    formats: [binary]
    name_template: "argus-server_{{ .Os }}_{{ .Arch }}"

  - id: agent
    ids: [agent]
    formats: [binary]
    name_template: "argus-agent_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
